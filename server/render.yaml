# Render Blueprint — one-click deploy of the Rap Zone API (free tier).
# Deploy: https://render.com -> New -> Blueprint -> select this repo.
# NOTE: free-tier services do not support persistent disks, so the SQLite DB
# and local media live on the ephemeral filesystem. The app re-seeds itself
# (admin account + demo content + sample media from scripts/output) on every
# boot, so everything keeps working. Uploaded/admin-created data is reset
# when the service redeploys.
services:
  - type: web
    name: rapzone-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /artists
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@rapzone.app
      - key: ADMIN_PASSWORD
        value: "Admin@123"
      - key: CORS_ORIGINS
        value: "*"
